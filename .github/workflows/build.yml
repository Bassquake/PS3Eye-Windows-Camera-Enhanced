name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        shell: pwsh
        run: |
          $v = "0.0.0-dev"
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart("v") }
          "APPVERSION=$v" >> $env:GITHUB_ENV

      - name: Configure
        run: >
          cmake -S . -B build -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Build
        run: cmake --build build --config Release

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/PS3EyeVCam.dll, build/Release/PS3EyeSetup.exe, README.md dist/
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Q "/DAppVersion=$env:APPVERSION" "/DDistDir=$PWD\dist" installer\PS3EyeCamera.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Compress-Archive -Force -Path dist/PS3EyeSetup.exe, dist/PS3EyeVCam.dll, dist/README.md -DestinationPath "dist/PS3EyeCamera-$env:APPVERSION-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: PS3EyeCamera-${{ env.APPVERSION }}
          path: |
            dist/PS3EyeCamera-Setup-*.exe
            dist/PS3EyeCamera-*-portable.zip

  linux-core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev
      - run: cmake -S . -B build && cmake --build build -j && ctest --test-dir build --output-on-failure
